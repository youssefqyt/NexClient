name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, zip

      - name: Validate composer.json
        run: cd backend && composer validate --no-check-publish

      - name: Install dependencies
        run: cd backend && composer install --prefer-dist --no-progress

      - name: Run Syntax Linting
        run: |
          find backend/app -name "*.php" -exec php -l {} \;

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci || npm install

      - name: Build Frontend
        run: cd frontend && npm run build

